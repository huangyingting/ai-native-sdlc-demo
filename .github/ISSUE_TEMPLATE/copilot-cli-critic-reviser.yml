name: "Copilot CLI demo: Critic-reviser loop"
description: Challenge an initial position with a dynamic critic before revising it.
title: "[Copilot CLI: Critic] "
labels: [copilot-agent-demo, "copilot-pattern:critic-reviser-loop"]
body:
  - type: markdown
    attributes:
      value: |
        Runs an initial-position, independent-critique, and revision loop. The orchestration behavior is applied automatically.
  - type: dropdown
    id: orchestrator_model
    attributes:
      label: Orchestrator model
      options:
        - gpt-6-luna
        - gpt-6-sol
        - gpt-6-astra
        - gpt-5.6-luna
        - gpt-5.6-terra
        - gpt-5.6-sol
        - gpt-5.5
        - gpt-5.4
        - gpt-5.4-mini
        - gpt-5.3-codex
        - gpt-5-mini
        - claude-sonnet-5
        - claude-sonnet-4.6
        - gemini-3.8-flash
        - grok-4.7
        - mai-code-1.1-flash
      default: 0
    validations:
      required: true
  - type: dropdown
    id: subagent_model
    attributes:
      label: Subagent model
      options:
        - gpt-6-luna
        - gpt-6-sol
        - gpt-6-astra
        - gpt-5.6-luna
        - gpt-5.6-terra
        - gpt-5.6-sol
        - gpt-5.5
        - gpt-5.4
        - gpt-5.4-mini
        - gpt-5.3-codex
        - gpt-5-mini
        - claude-sonnet-5
        - claude-sonnet-4.6
        - gemini-3.8-flash
        - grok-4.7
        - mai-code-1.1-flash
      default: 0
    validations:
      required: true
  - type: textarea
    id: task_prompt
    attributes:
      label: Task or question
      value: |
        Assess the Copilot CLI Trace Viewer workflow and interface, state an initial recommendation, then challenge its hidden assumptions, counterexamples, and unnecessary complexity before revising it into a simpler and more defensible proposal.
    validations:
      required: true
  - type: dropdown
    id: trace_detail
    attributes:
      label: Trace detail
      description: Detailed tracing includes redacted request and response payloads in the public Pages report and HTML artifact.
      options:
        - Include redacted request and response payloads
        - Metadata only
      default: 0
    validations:
      required: true
