name: IT Service Desk CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main]
    paths:
      - "demos/it-service-desk/**"
      - ".github/workflows/it-service-desk-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.pull_request.base.ref == github.event.repository.default_branch ||
      !startsWith(github.event.pull_request.base.ref, 'brownfield-delivery/') ||
      !contains(github.event.pull_request.body, 'Delivery Demo: brownfield-human-gated-delivery') ||
      !(
        contains(github.event.pull_request.body, 'Delivery Stage: spec') ||
        contains(github.event.pull_request.body, 'Delivery Stage: plan') ||
        contains(github.event.pull_request.body, 'Delivery Stage: tests')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: demos/it-service-desk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: demos/it-service-desk/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Verify lifecycle hook reporter against installed Vitest
        working-directory: .
        run: >-
          node --test --test-name-pattern="installed Vitest runtime"
          .github/brownfield-human-gated-delivery/tests/core.test.mjs
      - run: npm run lint
      - run: npm run build

  container-smoke:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.pull_request.base.ref == github.event.repository.default_branch ||
      !startsWith(github.event.pull_request.base.ref, 'brownfield-delivery/') ||
      !contains(github.event.pull_request.body, 'Delivery Demo: brownfield-human-gated-delivery') ||
      !(
        contains(github.event.pull_request.body, 'Delivery Stage: spec') ||
        contains(github.event.pull_request.body, 'Delivery Stage: plan') ||
        contains(github.event.pull_request.body, 'Delivery Stage: tests')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build container
        run: docker build --tag it-service-desk:ci demos/it-service-desk
      - name: Start container
        id: container
        run: |
          container_id="$(docker run --detach --publish 3000:3000 it-service-desk:ci)"
          echo "container-id=${container_id}" >> "$GITHUB_OUTPUT"
      - name: Wait for health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health \
              | jq -e '.status == "ok"' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Service desk did not become healthy." >&2
          exit 1
      - name: Smoke test dashboard
        run: |
          curl --fail --silent http://127.0.0.1:3000/ \
            | grep --fixed-strings 'data-testid="service-desk-dashboard"' >/dev/null
      - name: Show container logs
        if: failure() && steps.container.outputs.container-id != ''
        run: docker logs "${{ steps.container.outputs.container-id }}"
      - name: Stop container
        if: always() && steps.container.outputs.container-id != ''
        run: docker stop "${{ steps.container.outputs.container-id }}"
