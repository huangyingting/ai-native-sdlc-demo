name: Brownfield Delivery · Kickoff

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing Intent Issue number to resume idempotently
        type: number
        required: true

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: brownfield-delivery-intent-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  kickoff:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        contains(github.event.issue.labels.*.name, 'brownfield-human-gated-delivery:intent') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Start Issue document review or resume a legacy lifecycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
          INTENT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: node .github/brownfield-human-gated-delivery/scripts/github.mjs route-kickoff
