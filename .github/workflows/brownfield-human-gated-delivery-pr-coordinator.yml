name: Brownfield Delivery · PR Coordinator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/brownfield-human-gated-delivery/config.json"]
  pull_request_target:
    types: [opened, reopened, closed, edited, synchronize, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: ["Brownfield Delivery · Review Signal", "Brownfield Delivery · Stage CI"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  # Pending events may be replaced; every run reconciles all open PRs.
  group: brownfield-delivery-coordinator
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Enforce current lifecycle and Human review policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        run: node .github/brownfield-human-gated-delivery/scripts/github.mjs coordinate
