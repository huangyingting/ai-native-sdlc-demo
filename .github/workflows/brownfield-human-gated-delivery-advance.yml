name: Brownfield Delivery · Advance

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write

concurrency:
  group: brownfield-delivery-advance-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  advance:
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.body, 'Delivery Demo: brownfield-human-gated-delivery')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Close stage and assign next stage
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_ASSIGN_TOKEN: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
        run: node .github/brownfield-human-gated-delivery/scripts/github.mjs advance
